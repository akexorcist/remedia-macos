name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # workflow_dispatch can run on any branch, not just a tag — this repo's
      # tags are bare versions (2.3.0, not v2.3.0), so require that shape here.
      - name: Validate tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ref '${{ github.ref_name }}' does not match the required x.y.z tag format"
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('RemediaCore/Package.swift') }}
          restore-keys: spm-

      # Overridden here rather than in project.yml, which keeps its own
      # sane local-dev defaults: MARKETING_VERSION (the in-app version) from
      # the tag, CURRENT_PROJECT_VERSION (the internal build number) from
      # this workflow's own auto-incrementing run number.
      - name: Build Release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Remedia.xcodeproj \
            -scheme Remedia-Release \
            -configuration Release \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath DerivedData \
            MARKETING_VERSION="$RELEASE_TAG" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # Ad-hoc signed (CODE_SIGN_STYLE: Automatic, no team configured) —
      # runs fine locally, but Gatekeeper blocks it once downloaded/
      # quarantined until the user approves it once via right-click Open
      # or System Settings > Privacy & Security. No Apple Developer
      # account here for real notarization.
      - name: Build the .dmg
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          staging="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$staging"
          ditto DerivedData/Build/Products/Release/Remedia.app "$staging/Remedia.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Remedia -srcfolder "$staging" -ov -format UDZO \
            "$GITHUB_WORKSPACE/Remedia-$RELEASE_TAG.dmg"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "Remedia-$RELEASE_TAG.dmg" \
            --title "$RELEASE_TAG" \
            --generate-notes
